{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acadeno — Bootcamp Outcomes Check</title>
  <link rel="stylesheet" href="{% static 'quiz/style.css' %}">
</head>

<body class="{% block body_class %}{% endblock %}">
  <div class="shell">

    <div class="card">
      <div class="card-inner">
        {% if messages %}
        {% for message in messages %}
        <p class="form-error">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </div>
    <div class="footnote">AI-Integrated Python &amp; Django Bootcamp · Acadeno Technologies</div>
  </div>
</body>

</html>
