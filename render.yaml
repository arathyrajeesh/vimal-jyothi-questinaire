services:
  - type: web
    name: acadeno-outcomes
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn acadeno_outcomes.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: STAFF_ACCESS_CODE
        value: acadeno2026
